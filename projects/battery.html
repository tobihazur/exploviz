<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BLV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #fff;
    }
    #battery-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #battery-level {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 1.2em;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="battery-level">Checking...</div>
  <canvas id="battery-canvas"></canvas>
  <script>
    const canvas = document.getElementById('battery-canvas');
    const ctx = canvas.getContext('2d');
    const batteryLevelDisplay = document.getElementById('battery-level');

    // Offscreen canvas for cross-fade
    const offscreen = document.createElement('canvas');
    offscreen.width = canvas.width;
    offscreen.height = canvas.height;
    let prevFrame = null;
    let fadeAlpha = 0;
    let fadeDuration = 100; // ms
    let fadeStart = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      offscreen.width = canvas.width;
      offscreen.height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Color pairs: [FG, BG] from full to empty
    const colorPairs = [
      ["#EA6E4B", "#FAF26F"],
      ["#FAF26F", "#ABE3D2"],
      ["#ABE3D2", "#D653A9"],
      ["#D653A9", "#3A1E66"]
    ];

    // Helper: hex to [r,g,b]
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
      const num = parseInt(hex, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }
    // Helper: interpolate two [r,g,b] arrays
    function lerpColor(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t)
      ];
    }

    // Get interpolated FG/BG colors for a given battery level (0..1)
    function getColors(level) {
      const n = colorPairs.length - 1;
      const seg = 1 / n;
      let idx = Math.floor((1 - level) / seg);
      if (idx >= n) idx = n - 1;
      const t = ((1 - level) - idx * seg) / seg;
      const [fg1, bg1] = colorPairs[idx];
      const [fg2, bg2] = colorPairs[idx + 1];
      const fg = lerpColor(hexToRgb(fg1), hexToRgb(fg2), t);
      const bg = lerpColor(hexToRgb(bg1), hexToRgb(bg2), t);
      return { fg, bg };
    }

    function drawBatteryViz(level, doFade = true) {
      const width = canvas.width;
      const height = canvas.height;
      // Compute min and max block size: min 1-10, max 10-100, both linear with (1-level)
      const minBlockSize = Math.round(1 + (10 - 1) * (1 - level));
      const maxBlockSize = Math.round(10 + (100 - 10) * (1 - level));
      const minSize = Math.min(minBlockSize, maxBlockSize);
      const maxSize = Math.max(minBlockSize, maxBlockSize);
      const blockSize = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
      const blocksX = Math.ceil(width / blockSize);
      const blocksY = Math.ceil(height / blockSize);
      const totalBlocks = blocksX * blocksY;
      const fgBlocks = Math.round(totalBlocks * level);
      const { fg, bg } = getColors(level);

      // Save current frame to offscreen before drawing new frame
      if (doFade) {
        offscreen.getContext('2d').drawImage(canvas, 0, 0);
        prevFrame = true;
        fadeAlpha = 1;
        fadeStart = performance.now();
      }

      // Clear the canvas
      ctx.clearRect(0, 0, width, height);

      // Create an array of all block indices
      const indices = new Uint32Array(totalBlocks);
      for (let i = 0; i < totalBlocks; i++) indices[i] = i;
      for (let i = totalBlocks - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      function fillBlock(x, y, color) {
        const radius = (1 - level) * (blockSize / 2);
        ctx.save();
        ctx.beginPath();
        if (radius > 0.5) {
          if (ctx.roundRect) {
            ctx.roundRect(x, y, blockSize, blockSize, radius);
          } else {
            if (radius >= blockSize / 2 - 0.5) {
              ctx.arc(x + blockSize / 2, y + blockSize / 2, blockSize / 2, 0, 2 * Math.PI);
            } else {
              ctx.moveTo(x + radius, y);
              ctx.lineTo(x + blockSize - radius, y);
              ctx.quadraticCurveTo(x + blockSize, y, x + blockSize, y + radius);
              ctx.lineTo(x + blockSize, y + blockSize - radius);
              ctx.quadraticCurveTo(x + blockSize, y + blockSize, x + blockSize - radius, y + blockSize);
              ctx.lineTo(x + radius, y + blockSize);
              ctx.quadraticCurveTo(x, y + blockSize, x, y + blockSize - radius);
              ctx.lineTo(x, y + radius);
              ctx.quadraticCurveTo(x, y, x + radius, y);
            }
          }
        } else {
          ctx.rect(x, y, blockSize, blockSize);
        }
        ctx.closePath();
        ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
        ctx.fill();
        ctx.restore();
      }
      for (let n = 0; n < fgBlocks; n++) {
        const idx = indices[n];
        const bx = idx % blocksX;
        const by = Math.floor(idx / blocksX);
        fillBlock(bx * blockSize, by * blockSize, fg);
      }
      for (let n = fgBlocks; n < totalBlocks; n++) {
        const idx = indices[n];
        const bx = idx % blocksX;
        const by = Math.floor(idx / blocksX);
        fillBlock(bx * blockSize, by * blockSize, bg);
      }
    }

    function fadeStep() {
      if (!prevFrame) return;
      const now = performance.now();
      const elapsed = now - fadeStart;
      fadeAlpha = 1 - Math.min(elapsed / fadeDuration, 1);
      if (fadeAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = fadeAlpha;
        ctx.drawImage(offscreen, 0, 0);
        ctx.globalAlpha = 1;
        ctx.restore();
        requestAnimationFrame(fadeStep);
      } else {
        prevFrame = null;
      }
    }

    let batteryLevel = 1;
    let timerId = null;

    // Compute interval: 100% = 10ms, 1% = 10,000ms, exponential interpolation
    function computeInterval(level) {
      // Clamp level between 0.01 and 1
      level = Math.max(0.01, Math.min(1, level));
      // Exponential interpolation: interval = min * (max/min)^(1-level)
      const min = 10;      // ms at 100%
      const max = 10000;   // ms at 1%
      return Math.round(min * Math.pow(max / min, 1 - level));
    }

    function drawAndSchedule() {
      drawBatteryViz(batteryLevel, true);
      fadeStep();
      const interval = computeInterval(batteryLevel);
      timerId = setTimeout(drawAndSchedule, interval);
    }

    function startViz() {
      if (timerId) clearTimeout(timerId);
      drawAndSchedule();
    }

    function updateBatteryLevel(newLevel) {
      batteryLevel = newLevel;
      batteryLevelDisplay.textContent = `Battery level: ${Math.round(batteryLevel * 100)}%`;
      startViz();
    }

    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        updateBatteryLevel(battery.level);
        battery.addEventListener('levelchange', () => updateBatteryLevel(battery.level));
        window.addEventListener('resize', () => drawBatteryViz(batteryLevel));
      });
    } else {
      batteryLevelDisplay.textContent = 'Battery API not supported.';
    }
  </script>
</body>
</html>
